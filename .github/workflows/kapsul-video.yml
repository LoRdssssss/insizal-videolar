name: Kapsül video

# kapsuller/*.json değişince ilgili videoları MP4'e çevirir; çıktı "Artifacts" altında indirilir.
# Gizli anahtar kullanmaz, dış ağa yalnız kurulum için çıkar.
on:
  push:
    branches: [main]
    paths: ["kapsuller/*.json", "motor/**"]
  pull_request:
    branches: [main]
    paths: ["kapsuller/*.json", "motor/**"]
  workflow_dispatch:
    inputs:
      kapsul:
        description: "Tek kapsül (ör. 001-naocl). Boşsa tümü."
        required: false

permissions:
  contents: read

concurrency:
  group: kapsul-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Araçlar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Hangi kapsüller?
        id: sec
        run: |
          if [ -n "${{ github.event.inputs.kapsul }}" ]; then echo "liste=kapsuller/${{ github.event.inputs.kapsul }}.json" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only HEAD~1 HEAD | grep -q '^motor/' || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "liste=$(ls kapsuller/*.json | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          else
            echo "liste=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'kapsuller/*.json' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi
      - name: Çevir
        env:
          NODE_PATH: /tmp/pw/node_modules
        run: |
          mkdir -p cikti
          for f in ${{ steps.sec.outputs.liste }}; do
            node motor/render.cjs "$f" "cikti/$(basename "$f" .json).mp4"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: kapsul-videolari
          path: cikti/*.mp4
          retention-days: 90
